plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Terraformers maven for ModMenu.
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
	// Shedaniel maven for Cloth Config.
	maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Optional but most mods want it.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Extra mods as compileOnly (no remap needed on 26.1+):
	compileOnly "com.terraformersmc:modmenu:18.0.0"
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.1.154"

	// Sodium, compileOnly: only used by the optional sodium-compat mixin module
	// (see SodiumCompatMixinPlugin), which self-disables at runtime when Sodium
	// isn't installed. Not pulled from a Maven repo (Sodium doesn't publish to
	// one we already use) and not redistributed in this repo (Polyform Shield
	// license) - place sodium-fabric-0.9.2+mc26.2.jar (from Modrinth) in libs/
	// (gitignored) locally to build this module against real Sodium classes.
	compileOnly files('libs/sodium-fabric-0.9.2+mc26.2.jar')
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
